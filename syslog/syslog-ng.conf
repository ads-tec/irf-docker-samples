@version: 4.8
@include "scl.conf"

# Rendered by entrypoint.sh: @@VARIABLES@@ are replaced at container start.

options {
    # Keep the hostname from the message header. The IRF forwards the ports
    # into the rootless namespace, so the source IP alone is not always the
    # real sender.
    keep-hostname(yes);
    check-hostname(yes);
    use-dns(no);
    use-fqdn(no);
    chain-hostnames(no);
    create-dirs(yes);
    # readable for the SSH user "logs" (group logview), not writable
    owner("root");
    group("logview");
    dir-owner("root");
    dir-group("logview");
    dir-perm(0750);
    perm(0640);
    ts-format(iso);
    stats(freq(0));
    log-fifo-size(10000);
};

# default-network-drivers(): udp/514 + tcp/514 (RFC 3164 and RFC 5424,
# auto-detected), tcp/601 (RFC 5424, RFC 6587 framing), tls/6514 (RFC 5425)
# when tls() is given. Also runs syslog-ng's application parsers.
source s_network {
    default-network-drivers(
        max-connections(@@MAX_CONNECTIONS@@)
        log-iw-size(@@LOG_IW_SIZE@@)
@@TLS_OPTION@@
    );
};

source s_internal { internal(); };

destination d_remote {
    # One file per sender and hour, named by the receive time (R_*), so senders
    # with wrong clocks cannot create files for odd dates.
    file("/var/log/remote/$(sanitize ${HOST})/${R_YEAR}-${R_MONTH}-${R_DAY}_${R_HOUR}.log"
         template("${ISODATE} ${SOURCEIP} ${HOST} ${FACILITY}.${LEVEL} ${MSGHDR}${MESSAGE}\n")
         create-dirs(yes));
};

destination d_stdout { stdout(template("${ISODATE} ${HOST} ${FACILITY}.${LEVEL} ${MSGHDR}${MESSAGE}\n")); };

log { source(s_network); destination(d_remote); @@STDOUT_DEST@@ };
log { source(s_internal); destination(d_stdout); };
