[global]
   workgroup = WORKGROUP
   netbios name = XPPROXY250
   security = user
   map to guest = Bad User
   ea support = no
   server min protocol = SMB2
   server max protocol = SMB3
   smb ports = 445 139
   log level = 1
   max log size = 100

[xp-share]
   path = @@EXPORT_PATH@@
   browseable = yes
   read only = no
   guest ok = no
   valid users = smbuser
   force user = root
   force group = root
   store dos attributes = no
   map archive = no
   map hidden = no
   map readonly = no
   map system = no
