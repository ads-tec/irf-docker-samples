[global]
   workgroup = WORKGROUP
   server string = Windows XP Simulator
   security = user
   server min protocol = NT1
   server max protocol = NT1
   ntlm auth = ntlmv1-permitted
   lanman auth = yes
   server signing = disabled
   smb ports = 445 139
   log level = 1
   max log size = 100

[SharedFolder]
   path = /share
   browseable = yes
   read only = no
   valid users = xpuser
